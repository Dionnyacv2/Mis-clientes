<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Mis Clientes"/>
<title>Mis Clientes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#f2f2f7;color:#1c1c1e;padding-bottom:40px}
h2{font-size:20px;font-weight:700;padding:16px;background:#fff;border-bottom:1px solid #e5e5ea;position:sticky;top:0;z-index:10}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.mc{background:#fff;border-radius:14px;padding:14px;text-align:center}
.mc .l{font-size:12px;color:#8e8e93}
.mc .v{font-size:26px;font-weight:700}
.amber{color:#ff9500}.green{color:#34c759}
.ccard{margin:0 12px 10px;background:#fff;border-radius:14px;overflow:hidden}
.ccard-hdr{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.ci{flex:1;min-width:0}
.cn{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{font-size:12px;color:#8e8e93;margin-top:2px}
.arr{color:#c7c7cc;font-size:20px}
.cdetail{display:none;border-top:1px solid #f2f2f7}
.cdetail.open{display:block}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;margin:2px}
.b-active{background:#d1f5df;color:#1a7f3c}
.b-paused{background:#fff3cd;color:#856404}
.b-ended{background:#ececec;color:#6c6c70}
.b-debt{background:#ffd6d6;color:#c0392b}
.b-reel{background:#dbeafe;color:#1d4ed8}
.b-historia{background:#ede9fe;color:#6d28d9}
.b-tiktok{background:#fee2e2;color:#991b1b}
.b-youtube{background:#dcfce7;color:#166534}
.b-foto{background:#fce7f3;color:#9d174d}
.b-otro{background:#ececec;color:#6c6c70}
.sec-lbl{font-size:11px;font-weight:600;color:#8e8e93;text-transform:uppercase;padding:10px 14px 4px;letter-spacing:.05em}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid #f2f2f7;font-size:14px;gap:8px}
.row .lbl{color:#8e8e93}
.row .val{font-weight:600}
.red{color:#ff3b30}
.cb{padding:10px 14px;border-top:1px solid #f2f2f7}
.cb-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.cb-t{font-size:13px;font-weight:600;flex:1}
.cb-n{font-size:12px;color:#8e8e93}
.pgbg{background:#e5e5ea;border-radius:10px;height:5px;margin-bottom:8px;overflow:hidden}
.pgfill{height:5px;border-radius:10px;background:#34c759}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.vb{border-radius:10px;padding:7px 2px;text-align:center;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid #e5e5ea;background:#f5f5f7;color:#8e8e93;line-height:1.3}
.vb.done{background:#d1f5df;color:#1a7f3c;border-color:#a3e9bd}
.prow{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid #f2f2f7;font-size:14px}
.plbl{flex:1;color:#8e8e93;font-size:13px}
.pamt{font-weight:700;min-width:70px;text-align:right}
.pbtn{padding:6px 12px;border-radius:20px;border:none;font-size:12px;font-weight:700;cursor:pointer}
.pbtn.paid{background:#d1f5df;color:#1a7f3c}
.pbtn.unpaid{background:#ffd6d6;color:#c0392b}
.dbtn{width:calc(100% - 28px);margin:10px 14px;padding:12px;background:#fff0f0;color:#ff3b30;border:none;font-size:14px;font-weight:600;cursor:pointer;border-radius:10px}
.form-wrap{margin:0 12px 12px;background:#fff;border-radius:14px;overflow:hidden}
.form-wrap h3{font-size:15px;font-weight:700;padding:14px;border-bottom:1px solid #f2f2f7}
.finner{padding:14px}
.fl{display:block;font-size:11px;font-weight:600;color:#8e8e93;text-transform:uppercase;margin-bottom:5px;letter-spacing:.04em}
.fi,.fs{width:100%;padding:11px 13px;border:1.5px solid #e5e5ea;border-radius:12px;font-size:16px;background:#fff;color:#1c1c1e;margin-bottom:12px;-webkit-appearance:none}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{padding:7px 12px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid #e5e5ea;background:#f5f5f7;color:#6c6c70}
.chip.s-reel{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd}
.chip.s-historia{background:#ede9fe;color:#6d28d9;border-color:#c4b5fd}
.chip.s-tiktok{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.chip.s-youtube{background:#dcfce7;color:#166534;border-color:#86efac}
.chip.s-foto{background:#fce7f3;color:#9d174d;border-color:#f9a8d4}
.chip.s-otro{background:#ececec;color:#6c6c70;border-color:#d1d1d6}
.add-r{display:flex;gap:8px;margin-bottom:8px}
.add-r input{padding:10px 11px;border:1.5px solid #e5e5ea;border-radius:12px;font-size:15px;background:#fff;color:#1c1c1e}
.add-r .aq{width:60px}
.add-r .ad{flex:1}
.add-r button{padding:10px 13px;border-radius:12px;background:#007aff;color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.tlist{display:flex;flex-wrap:wrap;gap:5px;min-height:22px;margin-bottom:12px}
.ti{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:4px 9px;border-radius:20px;font-weight:600;border:1.5px solid}
.ti .xb{cursor:pointer;margin-left:2px;font-size:11px;opacity:.6}
.sbtn{width:100%;padding:15px;background:#007aff;color:#fff;border:none;font-size:17px;font-weight:700;border-radius:12px;cursor:pointer;margin-top:4px}
.show-form-btn{display:block;width:calc(100% - 24px);margin:0 12px 12px;padding:14px;background:#007aff;color:#fff;border:none;font-size:16px;font-weight:700;border-radius:14px;cursor:pointer;text-align:center}
.saved-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:opacity 0.3s;z-index:999;pointer-events:none}
.saved-toast.show{opacity:1}
.empty{text-align:center;padding:40px 20px;color:#8e8e93}
.empty .ico{font-size:50px;margin-bottom:12px}
</style>
</head>
<body>

<h2>Mis Clientes</h2>
<div class="metrics" id="metrics"></div>
<div id="clientList"></div>
<button class="show-form-btn" onclick="toggleForm()">+ Nuevo cliente</button>

<div class="form-wrap" id="formWrap" style="display:none">
  <h3>Nuevo cliente</h3>
  <div class="finner">
    <label class="fl">Nombre del cliente</label>
    <input class="fi" id="fn" placeholder="Ej. Restaurante ABC" autocomplete="off"/>
    <div class="fg2">
      <div>
        <label class="fl">Tipo de contrato</label>
        <select class="fs" id="ft"><option>Mensual</option><option>Bimestral</option><option>Trimestral</option><option>Semestral</option></select>
      </div>
      <div>
        <label class="fl">Status</label>
        <select class="fs" id="fs2"><option>Activo</option><option>Pausado</option><option>Finalizado</option></select>
      </div>
    </div>
    <div class="fg2">
      <div><label class="fl">Fecha inicio</label><input class="fi" id="fst" type="date" style="margin-bottom:0"/></div>
      <div><label class="fl">Monto total ($)</label><input class="fi" id="fto" type="number" placeholder="0" style="margin-bottom:0"/></div>
    </div>
    <div style="height:12px"></div>
    <label class="fl">Número de pagos</label>
    <input class="fi" id="fnp" type="number" value="1" min="1" max="12"/>
    <label class="fl">Entregables</label>
    <div class="chips" id="chips"></div>
    <div class="add-r">
      <input class="aq" id="fqt" type="number" value="1" min="1" max="99"/>
      <input class="ad" id="fds" placeholder="Descripción" autocomplete="off"/>
      <button onclick="addEnt()">+ Agregar</button>
    </div>
    <div class="tlist" id="tlist"></div>
    <button class="sbtn" onclick="saveClient()">Guardar cliente</button>
  </div>
</div>

<div class="saved-toast" id="toast">✓ Guardado</div>

<script>
const TY=[
  {k:'reel',l:'Reel',bc:'b-reel',sc:'s-reel',bg:'#dbeafe',fg:'#1d4ed8',bd:'#93c5fd'},
  {k:'historia',l:'Historia',bc:'b-historia',sc:'s-historia',bg:'#ede9fe',fg:'#6d28d9',bd:'#c4b5fd'},
  {k:'tiktok',l:'TikTok',bc:'b-tiktok',sc:'s-tiktok',bg:'#fee2e2',fg:'#991b1b',bd:'#fca5a5'},
  {k:'youtube',l:'YouTube',bc:'b-youtube',sc:'s-youtube',bg:'#dcfce7',fg:'#166534',bd:'#86efac'},
  {k:'foto',l:'Foto',bc:'b-foto',sc:'s-foto',bg:'#fce7f3',fg:'#9d174d',bd:'#f9a8d4'},
  {k:'otro',l:'Otro',bc:'b-otro',sc:'s-otro',bg:'#ececec',fg:'#6c6c70',bd:'#d1d1d6'},
];
const ABG=['#dbeafe','#dcfce7','#fce7f3','#ede9fe','#fee2e2','#fff3cd'];
const AFG=['#1d4ed8','#166534','#9d174d','#6d28d9','#991b1b','#856404'];
const LSKEY='crm_clientes_v4';

function loadData(){
  try{
    const raw=localStorage.getItem(LSKEY);
    if(raw){const d=JSON.parse(raw);return{clients:d.clients||[],vs:d.vs||{},open:d.open||{}};}
  }catch(e){}
  return{clients:[],vs:{},open:{}};
}

function saveData(){
  try{
    localStorage.setItem(LSKEY,JSON.stringify({clients,vs,open}));
    showToast();
  }catch(e){console.log('Error guardando:',e);}
}

function showToast(){
  const t=document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1500);
}

let {clients,vs,open}=loadData();
let selT='reel';
let tmp=[];

function gt(k){return TY.find(t=>t.k===k)||TY[5]}
function ini(n){return n.split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase()}
function unpaid(c){return c.payments.filter(p=>!p.paid).reduce((a,p)=>a+p.amount,0)}
function paid(c){return c.payments.filter(p=>p.paid).reduce((a,p)=>a+p.amount,0)}

function toggleForm(){
  const w=document.getElementById('formWrap');
  const showing=w.style.display!=='none';
  w.style.display=showing?'none':'block';
  if(!showing){
    document.getElementById('fn').value='';
    document.getElementById('fto').value='';
    document.getElementById('fnp').value='1';
    document.getElementById('fst').value=new Date().toISOString().split('T')[0];
    tmp=[];selT='reel';
    renderChips();renderTlist();
    setTimeout(()=>w.scrollIntoView({behavior:'smooth'}),100);
  }
}

function renderChips(){
  document.getElementById('chips').innerHTML=TY.map(t=>
    `<span class="chip ${t.k===selT?t.sc:''}" onclick="selT='${t.k}';renderChips()">${t.l}</span>`
  ).join('');
}

function addEnt(){
  const qty=parseInt(document.getElementById('fqt').value)||1;
  const desc=document.getElementById('fds').value.trim();
  tmp.push({type:selT,qty,desc});
  document.getElementById('fds').value='';
  renderTlist();
}

function rmEnt(i){tmp.splice(i,1);renderTlist();}

function renderTlist(){
  const el=document.getElementById('tlist');
  if(!tmp.length){el.innerHTML='<span style="font-size:12px;color:#8e8e93">Sin entregables aún</span>';return;}
  el.innerHTML=tmp.map((c,i)=>{
    const t=gt(c.type);
    return `<span class="ti" style="background:${t.bg};color:${t.fg};border-color:${t.bd}">${t.l} ${c.qty}x${c.desc?' — '+c.desc:''}<span class="xb" onclick="rmEnt(${i})">✕</span></span>`;
  }).join('');
}

function saveClient(){
  const name=document.getElementById('fn').value.trim();
  const start=document.getElementById('fst').value;
  if(!name){document.getElementById('fn').style.borderColor='#ff3b30';document.getElementById('fn').focus();return;}
  if(!tmp.length){document.getElementById('tlist').innerHTML='<span style="color:#ff3b30;font-size:13px">⚠ Agrega al menos un entregable</span>';return;}
  const total=parseFloat(document.getElementById('fto').value)||0;
  const npay=Math.max(1,parseInt(document.getElementById('fnp').value)||1);
  const base=Math.floor(total/npay);
  const payments=Array.from({length:npay},(_,i)=>({label:'Pago '+(i+1),amount:i===npay-1?total-base*(npay-1):base,paid:false}));
  clients.push({id:Date.now(),name,type:document.getElementById('ft').value,status:document.getElementById('fs2').value,start,total,content:[...tmp],payments});
  saveData();
  document.getElementById('formWrap').style.display='none';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function delClient(id){
  clients=clients.filter(c=>c.id!==id);
  delete open[id];
  saveData();
  render();
}

function togglePay(cid,pi){
  const c=clients.find(x=>x.id===cid);
  if(c){c.payments[pi].paid=!c.payments[pi].paid;saveData();render();}
}

function toggleVid(cid,ct,idx){
  const k=cid+'-'+ct+'-'+idx;
  vs[k]=!vs[k];
  saveData();render();
}

function toggleCard(id){
  open[id]=!open[id];
  saveData();render();
}

function render(){
  const act=clients.filter(c=>c.status==='Activo').length;
  const pend=clients.reduce((a,c)=>a+unpaid(c),0);
  document.getElementById('metrics').innerHTML=`
    <div class="mc"><div class="l">Clientes activos</div><div class="v">${act}</div></div>
    <div class="mc"><div class="l">Por cobrar</div><div class="v ${pend>0?'amber':'green'}">$${pend.toLocaleString()}</div></div>
  `;

  const el=document.getElementById('clientList');
  if(!clients.length){
    el.innerHTML=`<div class="empty"><div class="ico">📋</div><p>Sin clientes aún.<br>Toca <strong>+ Nuevo cliente</strong> para empezar.</p></div>`;
    return;
  }

  el.innerHTML=clients.map((c,i)=>{
    const bg=ABG[i%ABG.length],fg=AFG[i%AFG.length];
    const u=unpaid(c),p=paid(c);
    const stc=c.status==='Activo'?'b-active':c.status==='Pausado'?'b-paused':'b-ended';
    const isOpen=!!open[c.id];
    const cbadges=c.content.map(ct=>`<span class="badge ${gt(ct.type).bc}">${gt(ct.type).l} x${ct.qty}</span>`).join('');

    const contentHTML=c.content.map(ct=>{
      const t=gt(ct.type);
      const done=Array.from({length:ct.qty},(_,j)=>vs[c.id+'-'+ct.type+'-'+j]?1:0).reduce((a,x)=>a+x,0);
      const pct=Math.round(done/ct.qty*100);
      const boxes=Array.from({length:ct.qty},(_,j)=>{
        const d=!!vs[c.id+'-'+ct.type+'-'+j];
        return `<div class="vb${d?' done':''}" onclick="toggleVid(${c.id},'${ct.type}',${j})">${d?'✓':j+1}<br>${d?'OK':'Pend'}</div>`;
      }).join('');
      return `<div class="cb">
        <div class="cb-top"><span class="badge ${t.bc}">${t.l}</span><span class="cb-t">${ct.desc||t.l+' x'+ct.qty}</span><span class="cb-n">${done}/${ct.qty}</span></div>
        <div class="pgbg"><div class="pgfill" style="width:${pct}%"></div></div>
        <div class="vgrid">${boxes}</div>
      </div>`;
    }).join('');

    const payHTML=c.payments.map((p2,pi)=>`
      <div class="prow">
        <span class="plbl">${p2.label}</span>
        <span class="pamt">$${p2.amount.toLocaleString()}</span>
        <button class="pbtn ${p2.paid?'paid':'unpaid'}" onclick="togglePay(${c.id},${pi})">${p2.paid?'✓ Pagado':'✗ Pendiente'}</button>
      </div>`).join('');

    return `<div class="ccard">
      <div class="ccard-hdr" onclick="toggleCard(${c.id})">
        <div class="av" style="background:${bg};color:${fg}">${ini(c.name)}</div>
        <div class="ci">
          <div class="cn">${c.name}</div>
          <div class="cs">${c.type} · $${c.total.toLocaleString()}</div>
          <div style="margin-top:4px">
            <span class="badge ${stc}">${c.status}</span>
            ${u>0?`<span class="badge b-debt">Debe $${u.toLocaleString()}</span>`:''}
            ${cbadges}
          </div>
        </div>
        <div class="arr">${isOpen?'∨':'›'}</div>
      </div>
      <div class="cdetail${isOpen?' open':''}">
        <div class="sec-lbl">Contrato</div>
        <div class="row"><span class="lbl">Tipo</span><span class="val">${c.type}</span></div>
        <div class="row"><span class="lbl">Inicio</span><span class="val">${c.start}</span></div>
        <div class="row"><span class="lbl">Total</span><span class="val">$${c.total.toLocaleString()}</span></div>
        <div class="row"><span class="lbl">Cobrado</span><span class="val green">$${p.toLocaleString()}</span></div>
        <div class="row"><span class="lbl">Por cobrar</span><span class="val ${u>0?'red':'green'}">$${u.toLocaleString()}</span></div>
        <div class="sec-lbl">Entregables</div>
        ${contentHTML}
        <div class="sec-lbl">Pagos</div>
        ${payHTML}
        <button class="dbtn" onclick="delClient(${c.id})">🗑 Eliminar este cliente</button>
      </div>
    </div>`;
  }).join('');
}

renderChips();
render();
</script>
</body>
</html>
